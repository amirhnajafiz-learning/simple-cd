# Recording rules that turn raw histograms into the six comparable numbers and
# the direct-vs-Dapr ratio derived from them.
groups:
  - name: dapr-overhead
    interval: 15s
    rules:
      # Median and tail latency per connector, labelled {backend, mode, op}.
      # p95 is the one to quote for user-facing latency; p99 catches sidecar stalls.
      - record: bench:latency_p50
        expr: histogram_quantile(0.50, sum by (backend, mode, op, le) (rate(bench_op_duration_seconds_bucket[1m])))
      - record: bench:latency_p95
        expr: histogram_quantile(0.95, sum by (backend, mode, op, le) (rate(bench_op_duration_seconds_bucket[1m])))
      - record: bench:latency_p99
        expr: histogram_quantile(0.99, sum by (backend, mode, op, le) (rate(bench_op_duration_seconds_bucket[1m])))

      # Successful operations per second per connector.
      - record: bench:throughput
        expr: sum by (backend, mode, op) (rate(bench_ops_total{status="ok"}[1m]))

      # The headline number: how many times slower the Dapr path is than the
      # direct path for the same backend and operation. 1.0 means no overhead.
      - record: bench:dapr_overhead_ratio_p50
        expr: bench:latency_p50{mode="dapr"} / ignoring(mode) bench:latency_p50{mode="direct"}
      - record: bench:dapr_overhead_ratio_p99
        expr: bench:latency_p99{mode="dapr"} / ignoring(mode) bench:latency_p99{mode="direct"}

      # Absolute cost of the sidecar hop, in seconds, for those who prefer it
      # to a ratio.
      - record: bench:dapr_overhead_seconds_p50
        expr: bench:latency_p50{mode="dapr"} - ignoring(mode) bench:latency_p50{mode="direct"}
